name: Spring Boot Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Verify JAR
        run: |
          echo "Generated files:"
          ls -lah target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/spring-boot-app:latest \
            .

      - name: Verify Docker image
        run: |
          docker images
          docker image inspect \
            ${{ secrets.DOCKER_USERNAME }}/spring-boot-app:latest

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/spring-boot-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "================================"
            echo "Pulling latest image"
            echo "================================"

            docker pull ${{ secrets.DOCKER_USERNAME }}/spring-boot-app:latest

            echo "================================"
            echo "Removing old container"
            echo "================================"

            docker rm -f spring-boot-app 2>/dev/null || true

            echo "================================"
            echo "Starting new container"
            echo "================================"

            docker run -d \
              --name spring-boot-app \
              -p 8080:8081 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/spring-boot-app:latest

            echo "================================"
            echo "Waiting for application"
            echo "================================"

            sleep 10

            echo "================================"
            echo "Container status"
            echo "================================"

            docker ps -a

            echo "================================"
            echo "Application logs"
            echo "================================"

            docker logs --tail 100 spring-boot-app