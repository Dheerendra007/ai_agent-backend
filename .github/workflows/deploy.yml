name:Spring Boot build and deploy
on:
  push: 
    branches:
      - main  

env:
  IMAgE_NAME: spring-boot-app

jobs:
   build-deploy:
    runs-on:ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

          - name: Build with Maven
            run: mvn clean package -DskipTests

          -name: Build Docker image
            run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest .

          - name: Log in to Docker Hub
            uses: docker/login-action@v2
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

          - name: Push Docker image to Docker Hub
            run: docker push ${{secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest

          -name: Deploy to server
            uses: appleboy/ssh-action@v0.1.5
            with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SERVER_SSH_KEY }}
              script: |
                docker pull ${{secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest
                docker stop spring-boot-app || true
                docker rm spring-boot-app || true
                docker run -d --name spring-boot-app -p 8081:8081 ${{secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest 
                dockerimage prune -f